conclusion: >
  The existing Mermin-Ho/topological-flux instrument numerically
  distinguishes the residual M5 quotient pair Tzbar and TxTzbar, and
  the signed basic triplets descend through <Ty>. However, the two
  residual classes have the same component-sign tuple and the same net
  signed flux at half6, half12, and half18. The tested native
  Mermin-Ho sign summaries therefore do not provide the opposite binary
  orientation label required to anchor the Result-032 C-sign. The two
  Result-034 cross-system mappings remain admissible.

next_question: >
  Given Results 001-038, what is the strongest Reading Point to M5
  correspondence licensed by the executable evidence without imposing
  an additional cross-system orientation convention?
