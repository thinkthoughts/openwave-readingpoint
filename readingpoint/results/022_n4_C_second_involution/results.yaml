interpretation: >
  Both preregistered candidates T_y and T_z are distinct commuting
  involutions with T_x. For each pair, the four field states
  {I, T_x, T_a, T_x T_a} are distinct and the product is also an
  involution, supporting a V4-like field-level transformation structure.
  However, the action on the single effective operator C is non-faithful.
  T_x acts approximately as -1, while T_y and T_z act approximately as
  +1; consequently T_x T_y and T_x T_z also act approximately as -1.
  Therefore C alone cannot distinguish all four field-level transformation
  states.

constraints:
  - >
    V4-like refers to the tested field-level transformation composition
    pattern, not to an established physical state classification.
  - >
    The result does not establish Q8/{+1,-1}, despite the common abstract
    four-element structure.
  - >
    The existence of both T_y and T_z leaves open whether they belong to
    the same four-element subgroup or generate a larger abelian 2-group.
  - >
    Because the representation on C is non-faithful, C alone cannot supply
    a four-way operational classification.
  - >
    No Reading Point residue mapping is introduced.

relation_to_previous_results:
  result_021: >
    Result 021 established T_x = P o R_x as an involution acting
    approximately as C -> -C across the tested family.
  result_022: >
    T_y and T_z now provide independent commuting involution candidates.
    Each forms a V4-like four-state field-level structure with T_x, but C
    carries only a non-faithful sign representation of those structures.

