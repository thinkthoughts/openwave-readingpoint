interpretation: >
  The three tested involutions T_x, T_y, and T_z are independent,
  pairwise commuting, and each squares to identity. Their full generated
  closure contains eight distinct field transformations, so the tested
  field-level structure is C2^3-like rather than a uniquely selected V4.
  The effective operator C sees only a two-sign quotient of that closure:
  four transformations act approximately as +C and four approximately as
  -C. Therefore the representation on C is non-faithful and C alone cannot
  distinguish the eight field states or select one four-element subgroup.

constraints:
  - >
    C2^3-like refers to the tested field-level transformation closure and
    does not by itself identify physical states or topological defect classes.
  - >
    The closure was established at the tested reference geometry.
  - >
    Multiple embedded V4 subgroups exist abstractly inside a C2^3-like
    structure, so selecting one for a bridge requires an independent criterion.
  - >
    The non-faithful sign representation on C cannot supply a four-way
    operational state classification.
  - >
    No Q8/{+1,-1} identification is established by this result.
  - >
    No Reading Point residue mapping is introduced.

relation_to_previous_results:
  result_021: >
    T_x = P o R_x was established as an order-2 sign action on C.
  result_022: >
    T_y and T_z were each established as independent commuting involutions
    with T_x, producing V4-like four-state subsets.
  result_023: >
    The full closure of all three generators contains eight distinct
    commuting involutions, resolving the ambiguity in favor of a C2^3-like
    field-level structure with multiple embedded V4 subgroups.

