conclusion: Native reversal of g_chiral leaves the geometric chiral-overlap matrix
  C unchanged while reversing the weighted chiral term g_chiral*C. Reversal of chi
  also leaves geometric C approximately even. Neither tested native chiral sign therefore
  anchors the Result-032 C-sign.
next_question: Does a remaining independently implemented field-derived sign, such
