structural_consequence:
  statement: >
    The repository-native basic longest-axis/Mermin-Ho read is invariant
    under the Result-027 kernel <Ty> and therefore defines a legitimate
    observable on C2^3/<Ty>. At half6, half12, and half18 it also
    distinguishes Txbar, Tzbar, and TxTzbar. The full-F axis/component
    reads retain valid eight-state information but fail quotient descent and
    are therefore inadmissible as intrinsic labels of the four quotient
    classes.

