question: >
  Which existing repository-native M5 scalar observables descend through the
  Result-027 kernel <Ty>, and among those descended observables, which
  distinguish the three nonidentity quotient classes Txbar, Tzbar, and
  TxTzbar without using Reading Point residue labels?

