  result_028_cross_system_isomorphism_count: 6
  result_028_sixfold_cross_system_ambiguity_resolved: false
  reading_point_residue_pair_to_m5_class_assignment: "NOT ESTABLISHED"
  physical_q8_center_quotient_identification: "NOT ESTABLISHED"
  reading_point_to_m5_physical_mapping: "NOT ESTABLISHED"

interpretation: >
  Result 029 separates eight-state geometric information from true
  quotient-level information. comp1, comp2, comp3, and norm3 distinguish
  members inside Result-027 cosets and therefore do not descend through
  <Ty>. The basic longest-axis/Mermin-Ho read does descend, at machine-level
  numerical precision across all three tested flux scales, and it assigns
  distinct native signatures to the three nonidentity quotient classes.
  This supplies intrinsic M5-side labels without using Reading Point
  residue classes. It does not by itself reduce the six admissible
  cross-system isomorphisms from Result 028, because the Reading Point side
  still lacks an independently established corresponding label structure.

next_question: >
  Does the existing Reading Point/mod-30 construction independently
  distinguish the three nonidentity residue-pair classes {7,13}, {11,29},
  and {17,23} by a pre-existing algebraic, geometric, orientation, or other
  label that can be compared to the M5 basic quotient signatures without
  selecting a permutation after the fact?
