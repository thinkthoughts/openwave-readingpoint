    A repository-native observable may label C2^3/<Ty> only if it is
    numerically invariant within each Result-027 coset:
    f(I)=f(Ty), f(Tx)=f(TxTy), f(Tz)=f(TyTz), and
    f(TxTz)=f(TxTyTz), within the preregistered tolerance.

