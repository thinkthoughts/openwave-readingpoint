interpretation: >
  Result 032 removes the final internal ambiguity on the M5 quotient side.
  Result 031 had singled out Txbar using the independently defined G- and
  R-norm partition while leaving Tzbar and TxTzbar degenerate. The existing
  N4 chiral operator now separates that residual pair by sign, with Tzbar
  mapped to +C and TxTzbar to -C, and the sign classification is constant on
  every Result-027 coset. This does not yet select between the two remaining
  Reading Point mappings because no corresponding intrinsic second binary
  label has been established for {7,13} versus {17,23}.

