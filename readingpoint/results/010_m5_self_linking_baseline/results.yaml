conclusion: >
  The existing M5 N4 self-linking program defines an integer,
  reflection-odd handedness candidate N, but the current naive N*s
  azimuthal framing does not preserve the clean physics structure.
  N = 0 preserves the TBM/maximal-CP baseline, while every tested
  nonzero N breaks the TBM baseline, and delta_CP is not cleanly
  antisymmetric under N -> -N. The upstream negative/inconclusive
  verdict is therefore reproduced. A mu-tau-respecting definition
  of self-linking remains required before N can serve as the
  orientation-fixing bridge sought after Result 009.

upstream_side_effects:
  generated_summary_restored: true
  persistent_openwave_modification: false

next_question: >
  Does the existing M5 chiral-overlap or handedness-energy machinery
  provide a basis-invariant orientation observable that preserves the
  clean baseline better than the naive self-linking N*s construction?
