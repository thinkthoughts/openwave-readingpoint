result:
  id: 033
  slug: readingpoint_residual_pair_discriminator
  title: "Reading Point residual-pair discriminator from canonical mod-3 / mod-5 characters"
  status: pass

question: >
  Does the existing arithmetic structure of (Z/30Z)^* supply an independently
  defined second binary invariant that distinguishes the residual Reading Point
  quotient classes {7,13} and {17,23}, without importing M5 labels or C-sign?

parent_group:
