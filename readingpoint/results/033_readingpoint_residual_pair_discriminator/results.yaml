  notation: "(Z/30Z)^*"
  elements: [1, 7, 11, 13, 17, 19, 23, 29]

quotient:
  subgroup: [1, 19]
  notation: "(Z/30Z)^* / {1,19}"
  order: 4
  classification: "C2_x_C2"
  classes:
    - [1, 19]
    - [7, 13]
    - [11, 29]
    - [17, 23]

prior_result_030:
  parent_order_profiles:
    "{7,13}": [4, 4]
    "{11,29}": [2, 2]
    "{17,23}": [4, 4]
  singleton: [11, 29]
  residual_pair:
