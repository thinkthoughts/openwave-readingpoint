    chi5: -1
  distinguished_by_chi3: true
  verdict: supported

joint_quotient_labeling:
  signature_class_count: 4
  all_four_classes_uniquely_labeled: true
  preserves_quotient_multiplication: true
  verdict: supported

interpretation:
  first_binary_label:
    observable: chi5
    role: >
      Reproduces the Result-030 singleton-plus-pair distinction among the
      nonidentity quotient classes.
  second_binary_label:
    observable: chi3
    role: >
      Independently distinguishes the residual order-(4,4) pair {7,13}
      and {17,23}.
  joint_role: >
    The pair (chi3, chi5) gives four distinct quotient signatures and
    preserves multiplication. The Reading Point quotient is therefore fully
    intrinsically labeled by canonical arithmetic inherited from its mod-3
    and mod-5 CRT factors.

summary:
  chi3_multiplicative: supported
