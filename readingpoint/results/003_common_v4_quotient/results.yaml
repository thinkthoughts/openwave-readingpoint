id: readingpoint-003
status: supported
scope: mathematical_structure

test:
  name: common_v4_quotient
  script: readingpoint/tests/test_003_common_v4_quotient.py

readingpoint:
  structure: units_mod_30
  group: C4_x_C2
  cardinality: 8

  reduction:
    subgroup: [1, 19]
    subgroup_order: 2
    quotient_order: 4
    quotient_group: C2_x_C2
    cosets:
      - [1, 19]
      - [7, 13]
      - [11, 29]
      - [17, 23]

m5:
  theoretical_structure: quaternion_group_Q8
  group_order: 8

  reduction:
    subgroup: center
    center: ["1", "-1"]
    center_order: 2
    quotient_order: 4
    quotient_group: C2_x_C2
    cosets:
      - ["1", "-1"]
      - ["i", "-i"]
      - ["j", "-j"]
      - ["k", "-k"]

observations:
  original_group_cardinality_match: true
  original_groups_isomorphic: false
  quotient_cardinality_match: true
  quotient_element_order_profile_match: true
  common_quotient_structure: true

result:
  readingpoint_quotient: C2_x_C2
  m5_quotient: C2_x_C2
  common_quotient: C2_x_C2
  structural_correspondence: supported
  physical_correspondence_established: false

constraints:
  residue_to_quaternion_pairing_assumed: false
  quotient_isomorphism_selects_unique_pairing: false
  physical_mapping_assumed: false

conclusion: >
  The mod-30 unit group and Q8 are not isomorphic, but their
  independently defined quotients by {1,19} and {1,-1},
  respectively, are both isomorphic to C2 x C2. This establishes
  a shared mathematical quotient structure. It does not establish
  a physical correspondence between Reading Point residues and
  M5 biaxial defect states.

next_question: >
  Does the current M5 model expose an independently defined physical
  or topological observable that identifies q with -q, thereby making
  Q8/{1,-1} an operational rather than purely mathematical reduction?
