interpretation: >
  Result 031 provides the first independently matched label partition across
  the M5 and Reading Point quotients. The M5 full-frame connection and
  curvature norms single out Txbar and leave Tzbar and TxTzbar exactly
  degenerate at quotient level. The Reading Point parent-group order profile
  independently singles out {11,29} and leaves {7,13} and {17,23}
  equivalent under that invariant. Thus a partition-preserving quotient
  isomorphism must map Txbar to {11,29}. Two mappings remain because the
  paired classes may still be exchanged. This is a partial structural bridge,
  not a unique physical mapping.

next_question: >
  Is there an independently defined orientation, sign, ordering, or other
  repository-native invariant on both sides that distinguishes Tzbar from
  TxTzbar and independently distinguishes {7,13} from {17,23}, reducing the
  remaining C2 correspondence ambiguity from 2 to 1?
