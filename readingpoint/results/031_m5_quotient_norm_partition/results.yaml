    Both existing M5 full-frame norm observables descend through the
    Result-027 kernel <Ty> at machine precision and independently produce the
    same nonidentity singleton-plus-pair partition:
    Txbar | {Tzbar, TxTzbar}. Result 030 independently established the
    Reading Point partition {11,29} | {{7,13},{17,23}} from parent-element
