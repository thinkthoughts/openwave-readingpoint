qualification: Test 036 treats N -> -N exactly as the signed self-linking orientation
  reversal supplied by the existing N4 topology construction. It does not introduce
  an additional coordinate reflection. If repository interpretation requires an additional
  spatial operation beyond changing the native self-linking integer, this result is
  the parity of the executable +/-N construction rather than a complete physical-space
  parity law.
conclusion: Native N4 self-linking reversal N -> -N gives no clean odd/even relation
  for the full chiral-overlap matrix C. Baseline-subtracted dC also gives no clean
  odd/even orientation relation. Reading Point chi3 sign mapping remains unassigned.
next_question: Do any remaining independently implemented M5 sign/orientation conventions
  have an existing executable relation to C that could supply the unresolved cross-system
  orientation anchor, or has the current implementation reached a twofold stopping
  boundary?
